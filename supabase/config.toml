project_id = "idupqjzvkpsscyjetmll"

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://thepatnaorg.vercel.app"
additional_redirect_urls = ["https://thepatnaorg.vercel.app/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 604800

[auth.email.template]

[auth.sms]
